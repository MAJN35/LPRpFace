# Serves the SPA and proxies the API (same origin: no CORS needed). HTTP on 8080; HTTPS on 8443 when a certificate
# is mounted (tools/make_cert.sh -> deploy/certs; enabled by docker-entrypoint.d/40-lpr-tls.sh). HTTPS is what lets
# browsers show OS notifications (secure context); the certificate is self-signed for the LAN.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  include /etc/nginx/lpr-locations.conf;
}
