# Serves the SPA and proxies the API (same origin: no CORS needed). Listens on 8080 inside the container.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location /openapi.json { proxy_pass http://backend:8000; }
  location /docs { proxy_pass http://backend:8000; }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
