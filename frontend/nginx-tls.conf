# HTTPS server, copied into conf.d by 40-lpr-tls.sh only when /etc/nginx/certs/tls.crt exists.
server {
  listen 8443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/lpr-locations.conf;
}
