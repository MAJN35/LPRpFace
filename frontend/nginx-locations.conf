# Shared by the HTTP (8080) and HTTPS (8443) servers (security headers + locations).
  server_tokens off;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss: blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  # Live video (HLS from the mediamtx gateway), only for signed-in users. Not /live/: nginx would redirect the
  # dashboard page /live to /live/ (prefix location with proxy_pass). The gateway is resolved per request so
  # the dashboard starts even when it is down.
  location /hls/ {
    auth_request /_live_auth;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $media http://media:8888;
    rewrite ^/hls/(.*)$ /$1 break;
    proxy_pass $media;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
  }
  location = /_live_auth {
    internal;
    proxy_pass http://backend:8000/api/v1/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }
  location /openapi.json { proxy_pass http://backend:8000; }
  location /docs { proxy_pass http://backend:8000; }
  location = /manifest.webmanifest {       # not in nginx's mime.types
    root /usr/share/nginx/html;
    default_type application/manifest+json;
  }
  location = /sw.js {                      # service worker (OS notifications): always revalidated
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
