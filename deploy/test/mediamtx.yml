# Local RTSP test server (mediamtx 1.12.3): replays the synthetic test videos as camera streams and accepts the
# annotated output stream. Test-only; reachable only on the compose network as mediamtx:8554. The real cameras replace these
# paths with their own RTSP URLs in sources.yaml.
logLevel: warn
rtsp: yes
rtspAddress: :8554            # inside the compose network only (not published)
rtspTransports: [tcp, udp]
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
paths:
  cam-01:                # H.264 1920x1080 25 fps, like cam-01
    runOnInit: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /videos/test_h264.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://127.0.0.1:8554/cam-01
    runOnInitRestart: yes
  cam-02:                # H.265 2560x1440 20 fps, like cam-02
    runOnInit: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /videos/test_h265.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://127.0.0.1:8554/cam-02
    runOnInitRestart: yes
  lpr-out: {}            # published by the DeepStream app (LPR_OUTPUT_RTSP)
  all_others:
