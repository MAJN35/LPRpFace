# Production sources. Placeholders: replace the host/path, put credentials in deploy/.env (CAM01_USER, ...).
defaults: {max_fps: 10, min_plate_px: 60, face_blur: false, record: false, rtsp_transport: tcp}   # face_blur: true per camera masks faces on the live view
sources:
  - id: cam-01
    name: "Camera 1 (1920x1080 H.264 25 fps)"
    type: rtsp
    uri: "rtsp://${CAM01_USER}:${CAM01_PASS}@CAM01_HOST:554/Streaming/Channels/101"   # placeholder
    enabled: false
    max_fps: 10
  - id: cam-02
    name: "Camera 2 (2560x1440 H.265 20 fps)"
    type: rtsp
    uri: "rtsp://${CAM02_USER}:${CAM02_PASS}@CAM02_HOST:554/Streaming/Channels/101"   # placeholder
    enabled: false
    max_fps: 10
