%YAML:1.0
# NvSORT (DeepStream 6.3 sample config_tracker_NvSORT.yml) tuned for small, fast plates at 8-10 fps.
# Changes from the sample: probationAge 5 -> 1 (ids from the first frames), maxShadowTrackingAge 26 -> 10
# (~1 s at 10 fps), minMatchingScore4Iou 0.2159 -> 0.1 and minMatchingScore4SizeSimilarity 0.4019 -> 0.3 (plates
# move far between frames at low fps; the Kalman prediction carries the association), minDetectorConfidence 0.3.
BaseConfig:
  minDetectorConfidence: 0.3
TargetManagement:
  enableBboxUnClipping: 0
  maxTargetsPerStream: 300        # characters are tracked too
  minIouDiff4NewTarget: 0.5780
  minTrackerConfidence: 0.8216
  probationAge: 1
  maxShadowTrackingAge: 10
  earlyTerminationAge: 1
TrajectoryManagement:
  useUniqueID: 0
DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  checkClassMatch: 1
  minMatchingScore4Overall: 0.2
  minMatchingScore4SizeSimilarity: 0.3
  minMatchingScore4Iou: 0.1
  matchingScoreWeight4SizeSimilarity: 0.1365
  matchingScoreWeight4Iou: 0.3836
  tentativeDetectorConfidence: 0.35
  minMatchingScore4TentativeIou: 0.2867
  usePrediction4Assoc: 1
StateEstimator:
  stateEstimatorType: 2
  noiseWeightVar4Loc: 0.0301
  noiseWeightVar4Vel: 0.0017
  useAspectRatio: 1
